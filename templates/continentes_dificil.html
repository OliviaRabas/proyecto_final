<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegí un continente - Difícil</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/continentes_dificil.css') }}">
</head>
<body>
    <header>
        <h1>🔥 Modo difícil: ¿dónde querés jugar?</h1>
    </header>

    <main>
        <div class="menu-continentes">
            <div class="opcion" data-href="/jugar/dificil/america">🌎 América</div>
            <div class="opcion" data-href="/jugar/dificil/europa">🏰 Europa</div>
            <div class="opcion" data-href="/jugar/dificil/asia">🏯 Asia</div>
            <div class="opcion" data-href="/jugar/dificil/africa">🦁 África</div>
            <div class="opcion" data-href="/jugar/dificil/oceania">🦘 Oceanía</div>
            <div class="opcion" data-href="/jugar/dificil/global">🌍 Global</div>
        </div>
    </main>

    <footer>
        <div class="lado">
            <span>▲▼◀▶ Moverse</span>
        </div>
        <div class="lado">
            <span>⏎ Enter: Aceptar</span>
            <span>Esc: Volver</span>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/input.js') }}"></script>
    <script src="{{ url_for('static', filename='js/continentes_dificil.js') }}"></script>
</body>
</html>
