<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudiar - Guess the Flag</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estudiar.css') }}">
</head>
<body>
    <header>
        <h1>📖 Estudiar</h1>
    </header>

    <main>
        {% for c in continentes %}
        <section class="continente" id="{{ c.id }}">
            <h2>{{ c.emoji }} {{ c.nombre }}</h2>
            <div class="banderas">
                {% for p in c.paises %}
                <div class="pais">
                    <img src="{{ p.imagen }}" alt="Bandera de {{ p.nombre }}" loading="lazy" decoding="async">
                    <span>{{ p.nombre }}</span>
                </div>
                {% endfor %}
            </div>
        </section>
        {% endfor %}
    </main>

    <footer>
        <div class="lado">
            <span>▲ ▼ Desplazarte</span>
            <span>◀ ▶ Cambiar de continente</span>
        </div>
        <div class="lado">
            <span>Esc: Volver</span>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/input.js') }}"></script>
    <script src="{{ url_for('static', filename='js/estudiar.js') }}"></script>
</body>
</html>
